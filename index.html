<script>
/* ===== 語言切換（繁體／简体）：獨立附加，不改動原有程式 ===== */
(function(){
  /* 先換常用詞，再逐字轉換 */
  const PH=[['匯出','导出'],['滙出','导出'],['檔案','文件'],['甚麼','什么'],['自訂','自定义'],['相片','照片']];
  const T2S={};
  ('計计 劃划 書书 報报 傳传 議议 體体 簡简 動动 讀读 種种 況况 對对 選选 擇择 檔档 數数 應应 欄栏 匯汇 滙汇 稱称 項项 個个 於于 會会 內内 點点 擊击 與与 顯显 單单 齡龄 為为 設设 這这 說说 適适 圖图 貨货 幣币 觀观 樂乐 舉举 詳详 細细 後后 發发 還还 額额 賠赔 償偿 現现 歲岁 當当 換换 複复 製制 見见 屬属 總总 兩两 張张 並并 標标 題题 頁页 開开 記记 處处 認认 負负 號号 檢检 測测 偵侦 組组 連连 遞递 許许 資资 價价 證证 預预 繳缴 費费 桿杆 該该 過过 黃黄 側侧 線线 響响 時时 樣样 規规 帳账 戶户 備备 註注 隨随 終终 結结 較较 麼么 間间 訂订 變变 進进 階阶 隱隐 據据 來来 診诊 斷断 問问 請请 創创 業业 實实 際际 約约 準准 沒没 掃扫 電电 頭头 務务 錯错 誤误 無无 輸输 餘余 學学 幾几 範范 圍围 儲储 險险 維维 從从 萬万 財财 長长 續续 載载 網网 絡络 試试 畫画 關关 閉闭 則则 確确 覽览 頂顶 橫横 寫写 機机 腦脑 敗败 構构 損损 鍵键 視视 積积 歸归 遠远 煥焕 紅红 '+
   '壽寿 豐丰 環环 寶宝 愛爱 憂忧 龍龙 躍跃 國国 亞亚 聯联 華华 銀银 譽誉 鑽钻 榮荣 駿骏 禮礼 馬马 東东 風风 雲云 揚扬 領领 啟启 悅悦 貴贵 優优 穩稳 紀纪 樹树 滿满 飛飞 騰腾 護护 衛卫 鴻鸿 運运 達达 產产 權权 區区 級级 類类 經经 濟济 門门 醫医 療疗 養养 親亲 質质 靈灵 獲获 給给 億亿 圓圆 條条 參参 責责 顧顾 團团 專专 邊边 補补 蓋盖 別别 導导 讓让 將将 買买 賣卖 層层 塊块 歷历 簽签 職职 員员 師师 兒儿 孫孙')
    .split(' ').forEach(function(q){if(q.length===2)T2S[q[0]]=q[1];});

  let lang='t';
  try{lang=localStorage.getItem('pra_lang')==='s'?'s':'t';}catch(e){}
  const conv=function(s){
    PH.forEach(function(q){if(s.indexOf(q[0])>=0)s=s.split(q[0]).join(q[1]);});
    return s.replace(/[\u4e00-\u9fff]/g,function(c){return T2S[c]||c;});
  };
  const L=function(s){return lang==='s'&&typeof s==='string'&&s?conv(s):s;};

  /* ---------- 畫面文字 ---------- */
  const rec=new WeakMap();   /* 文字節點 → {src 原文, out 轉換後} */
  const skip=function(n){const p=n.parentElement;return !p||p.closest('script,style,[data-nolang]');};
  function one(n){
    if(skip(n))return;
    const r=rec.get(n),v=n.nodeValue;
    if(r&&v===r.out)return;
    const out=conv(v);rec.set(n,{src:v,out:out});
    if(out!==v)n.nodeValue=out;
  }
  function each(root,fn){
    if(root.nodeType===3){fn(root);return;}
    if(root.nodeType!==1)return;
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),a=[];let n;
    while((n=w.nextNode()))a.push(n);
    a.forEach(fn);
  }
  const AT=['placeholder','title'];
  function attr1(el){AT.forEach(function(a){const v=el.getAttribute(a);if(v){const c=conv(v);if(c!==v)el.setAttribute(a,c);}});}
  function attrs(root){if(root.nodeType!==1)return;attr1(root);root.querySelectorAll('[placeholder],[title]').forEach(attr1);}

  const T0=document.title;
  let box=null;
  function apply(){
    document.documentElement.lang=lang==='s'?'zh-Hans':'zh-HK';
    if(box)[].forEach.call(box.children,function(b){b.classList.toggle('on',b.dataset.l===lang);});
    if(lang==='s'){
      document.title=conv(T0);
      each(document.body,one);attrs(document.body);
    }else{
      document.title=T0;
      each(document.body,function(n){const r=rec.get(n);if(r){if(n.nodeValue===r.out&&r.src!==r.out)n.nodeValue=r.src;rec.delete(n);}});
      try{if(typeof render==='function')render();if(typeof renderScn==='function')renderScn();}catch(e){}
    }
  }
  new MutationObserver(function(ms){
    if(lang!=='s')return;
    ms.forEach(function(m){
      if(m.type==='characterData')one(m.target);
      else if(m.type==='attributes')attr1(m.target);
      else m.addedNodes.forEach(function(n){each(n,one);attrs(n);});
    });
  }).observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:AT});

  /* ---------- 語言按鈕 ---------- */
  const st=document.createElement('style');
  st.textContent='.lang{position:absolute;right:0;top:-32px;display:inline-flex;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:3px;z-index:2}'+
    '.lang button{border:0;background:transparent;color:#cbd5e1;padding:4px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}'+
    '.lang button.on{background:#f59e0b;color:#0f172a}';
  document.head.appendChild(st);
  box=document.createElement('div');box.className='lang';box.setAttribute('data-nolang','1');
  box.innerHTML='<button data-l="t">繁體</button><button data-l="s">简体</button>';
  (document.querySelector('header .hd')||document.body).appendChild(box);
  box.addEventListener('click',function(e){
    const l=e.target.dataset&&e.target.dataset.l;if(!l||l===lang)return;
    lang=l;try{localStorage.setItem('pra_lang',l);}catch(err){}
    apply();
  });

  /* ---------- 提示視窗 ---------- */
  ['alert','confirm'].forEach(function(k){const f=window[k].bind(window);window[k]=function(m){return f(L(m));};});
  (function(){const f=window.prompt.bind(window);window.prompt=function(m,d){return f(L(m),d);};})();

  /* ---------- 複製內容 ---------- */
  if(typeof window.clip==='function'){const c0=window.clip;window.clip=function(t,h){return c0(L(t),h?L(h):h);};}

  /* ---------- 檔案名稱（Excel／PDF 下載及分享） ---------- */
  document.addEventListener('click',function(e){const a=e.target;if(a&&a.tagName==='A'&&a.download)a.download=L(a.download);},true);
  if(typeof window.deliver==='function'){const d0=window.deliver;window.deliver=function(b,n,t){return d0(b,L(n),t);};}

  /* ---------- Excel：寫出檔案前把分頁名稱、儲存格文字及頁尾轉換 ---------- */
  if(window.ExcelJS&&ExcelJS.Workbook){
    const WB0=ExcelJS.Workbook;
    ExcelJS.Workbook=function(){
      const wb=new WB0(),x=wb.xlsx,w0=x.writeBuffer.bind(x);
      x.writeBuffer=function(o){
        if(lang==='s')wb.eachSheet(function(ws){
          try{const n=conv(ws.name);if(n!==ws.name)ws.name=n;}catch(e){}
          try{if(ws.headerFooter&&ws.headerFooter.oddFooter)ws.headerFooter.oddFooter=conv(ws.headerFooter.oddFooter);}catch(e){}
          ws.eachRow(function(row){row.eachCell(function(c){
            if(typeof c.value==='string'){const v=conv(c.value);if(v!==c.value)c.value=v;}
          });});
        });
        return w0(o);
      };
      return wb;
    };
  }

  /* ---------- PDF：轉成圖片前先把該頁文字轉換 ---------- */
  if(typeof window.pdfOut==='function'){
    const p0=window.pdfOut;
    window.pdfOut=function(list){
      if(window.html2canvas&&!window.html2canvas._lg){
        const h0=window.html2canvas;
        const h=function(el,o){
          if(lang==='s')each(el,function(n){const v=conv(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;});
          return h0(el,o);
        };
        h._lg=1;window.html2canvas=h;
      }
      return Promise.resolve(p0(list)).finally(function(){
        const b=document.getElementById('pdf');if(b)b.textContent='⬇ 匯出 PDF';
      });
    };
  }

  apply();
})();
</script>
